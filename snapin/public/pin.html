<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.pintop{height:28px;background:rgba(17,24,39,.92);display:flex;align-items:center;
  padding:0 10px;gap:8px;font:11px/1 system-ui;color:#60a5fa;cursor:move;
  -webkit-app-region:drag;border-bottom:1px solid #1e293b}
.pintop .ctrl{-webkit-app-region:no-drag;cursor:pointer;opacity:.7}
.pintop .ctrl:hover{opacity:1}
#img{display:block;width:100%;height:calc(100% - 28px);object-fit:contain;background:#0a0e1a}
</style>
</head>
<body>
<div class="pintop">
  <span>📌 贴图</span>
  <span style="flex:1"></span>
  <span class="ctrl" id="btnOpacity" title="切换透明度">◐</span>
  <span class="ctrl" id="btnClose" title="关闭">✕</span>
</div>
<img id="img"/>
<script>
const { getCurrentWebviewWindow } = window.__TAURI__.webviewWindow;
const params = new URLSearchParams(location.search);
const imgB64 = params.get('img') || '';
const img = document.getElementById('img');
if (imgB64) img.src = 'data:image/png;base64,' + decodeURIComponent(imgB64);

// 关闭
document.getElementById('btnClose').onclick = () => getCurrentWebviewWindow().close();

// 透明度切换
let opacity = 1;
document.getElementById('btnOpacity').onclick = async () => {
  opacity = opacity === 1 ? 0.7 : opacity === 0.7 ? 0.4 : 1;
  document.body.style.opacity = opacity;
};

// 滚轮缩放窗口
document.addEventListener('wheel', async (e) => {
  const win = getCurrentWebviewWindow();
  const factor = await win.scaleFactor();
  const size = await win.innerSize();
  const delta = e.deltaY > 0 ? -40 : 40;
  const nw = Math.max(100, size.width / factor + delta);
  const nh = Math.max(60, size.height / factor + delta);
  win.setSize({ type: 'Logical', width: nw, height: nh });
}, { passive: true });
</script>
</body>
</html>
