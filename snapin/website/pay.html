<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>购买 Snapin 闪贴</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--line:#1e293b;--brand:#3b82f6;--cyan:#22d3ee;--txt:#e5edff;--muted:#8595b8;--glow:0 0 30px rgba(59,130,246,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","Segoe UI","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5),var(--glow)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.head svg{width:36px;height:36px}
.head h1{font-size:20px;font-weight:800}
.head .sub{font-size:12px;color:var(--muted)}
.price{font-size:42px;font-weight:900;text-align:center;margin:16px 0 6px}
.price .curr{font-size:18px;color:var(--muted);vertical-align:top}
.price-note{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.form-label{font-size:12px;color:var(--muted);margin:14px 0 6px}
.input{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none}
.input:focus{border-color:var(--brand)}
.channels{display:flex;gap:12px;margin-top:20px}
.ch-btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:center;transition:.2s}
.ch-btn:hover{border-color:var(--brand)}
.ch-btn.active{border-color:var(--brand);box-shadow:var(--glow)}
.ch-btn .icon{font-size:28px;margin-bottom:6px}
.ch-btn .name{font-size:13px;color:var(--muted)}
.pay-btn{display:block;width:100%;margin-top:22px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;box-shadow:var(--glow)}
.pay-btn:hover{filter:brightness(1.1)}
.pay-btn:disabled{opacity:.5;cursor:not-allowed}
/* QR / result */
.qr-area{display:none;text-align:center;margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#0b1220}
.qr-area img{width:200px;height:200px;border-radius:8px;background:#fff;padding:8px}
.qr-area .tip{margin-top:10px;font-size:12px;color:var(--muted)}
.result{display:none;text-align:center;margin-top:20px;padding:20px;border:1px solid #22c55e;border-radius:12px;background:rgba(34,197,94,.08)}
.result h3{color:#22c55e;margin-bottom:8px}
.result .key{font:bold 18px ui-monospace,monospace;color:var(--txt);margin:10px 0;padding:10px;background:#0b1220;border-radius:8px;letter-spacing:1px}
.result .note{font-size:12px;color:var(--muted)}
.err{color:#ef4444;font-size:13px;margin-top:12px;display:none}
.features{margin-top:20px;font-size:12px;color:var(--muted);line-height:2}
.features li::marker{color:var(--brand)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <svg viewBox="0 0 96 96" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="10" y="10" width="76" height="76" rx="22" fill="url(#g)"/><path d="M30 40V30H40" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M66 56V66H56" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="48" cy="48" r="10" fill="#fff"/></svg>
    <div><h1>购买 Snapin 闪贴</h1><div class="sub">一次性买断 · 永久使用 · 无订阅</div></div>
  </div>
  <div class="price"><span class="curr">¥</span>79</div>
  <div class="price-note">含 2 台设备授权 · macOS + Windows 通用</div>

  <div class="form-label">接收授权码的邮箱</div>
  <input class="input" id="email" type="email" placeholder="your@email.com"/>

  <div class="channels">
    <div class="ch-btn active" data-ch="alipay" onclick="selectChannel('alipay')">
      <div class="icon">💰</div><div class="name">支付宝</div>
    </div>
    <div class="ch-btn" data-ch="wechat" onclick="selectChannel('wechat')">
      <div class="icon">💬</div><div class="name">微信支付</div>
    </div>
  </div>

  <button class="pay-btn" id="payBtn" onclick="createOrder()">确认支付 ¥79</button>
  <div class="err" id="err"></div>

  <div class="qr-area" id="qrArea">
    <img id="qrImg" src="" alt="收款码"/>
    <div class="tip" id="qrTip">请扫码转账 ¥79，备注下方订单号</div>
    <div class="order-no" id="orderNo" style="margin-top:10px;font:bold 16px ui-monospace,monospace;color:#60a5fa;background:#0b1220;padding:8px 14px;border-radius:8px;display:inline-block;cursor:pointer" onclick="copyOrder()" title="点击复制"></div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted)">⚠️ 转账时务必备注订单号，否则无法自动匹配</div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">支付完成后请等待确认（通常 5 分钟内），页面将自动刷新</div>
  </div>

  <div class="result" id="result">
    <h3>🎉 支付成功！</h3>
    <p>您的授权码已生成：</p>
    <div class="key" id="licenseKey"></div>
    <div class="note">授权码已发送到您的邮箱，请在 Snapin 软件中输入邮箱 + 授权码激活。</div>
  </div>

  <ul class="features">
    <li>全部功能永久解锁（贴图、标注、拾色器、长截图、历史记录）</li>
    <li>同大版本免费升级</li>
    <li>邮箱 + 授权码离线激活，数据全本地</li>
  </ul>
</div>

<script>
const API = ''; // 留空=同域，部署时改为 https://api.snapin.app
let channel = 'alipay';
let pollTimer = null;

function selectChannel(ch) {
  channel = ch;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.toggle('active', b.dataset.ch === ch));
}

async function createOrder() {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) { showErr('请输入有效邮箱'); return; }
  hideErr();
  document.getElementById('payBtn').disabled = true;

  try {
    const res = await fetch(API + '/api/payment/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, channel })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '创建订单失败');

    // 显示收款码
    document.getElementById('qrArea').style.display = 'block';
    document.getElementById('qrImg').src = data.qr_url;
    document.getElementById('qrTip').textContent = data.message;
    document.getElementById('orderNo').textContent = data.order_no;
    currentOrderNo = data.order_no;

    // 开始轮询
    startPolling(data.order_no);
  } catch (e) {
    showErr(e.message);
    document.getElementById('payBtn').disabled = false;
  }
}

let currentOrderNo = '';
function copyOrder() {
  navigator.clipboard.writeText(currentOrderNo);
  document.getElementById('orderNo').textContent = currentOrderNo + ' ✓ 已复制';
  setTimeout(() => document.getElementById('orderNo').textContent = currentOrderNo, 1500);
}

function startPolling(orderNo) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(API + `/api/payment/status?order_no=${orderNo}`);
      const data = await res.json();
      if (data.status === 'paid') {
        clearInterval(pollTimer);
        document.getElementById('qrArea').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('licenseKey').textContent = data.license_key;
        document.getElementById('payBtn').style.display = 'none';
      }
    } catch (_) {}
  }, 2000);
}

function showErr(msg) { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }
function hideErr() { document.getElementById('err').style.display = 'none'; }
</script>
</body>
</html>
