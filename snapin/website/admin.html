<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snapin 管理后台</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--line:#1e293b;--brand:#3b82f6;--cyan:#22d3ee;--txt:#e5edff;--muted:#8595b8;--glow:0 0 30px rgba(59,130,246,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","Segoe UI","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:24px}
.container{max-width:1000px;margin:0 auto}
.login{max-width:400px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5),var(--glow)}
.login h2{text-align:center;margin-bottom:24px}
.input{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none;margin-bottom:12px}
.input:focus{border-color:var(--brand)}
.btn{padding:10px 20px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;font-weight:600;border:none;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-danger{background:#dc2626}
.btn-success{background:#16a34a}
.dashboard{display:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.header h1{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;color:var(--cyan)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.section h3{margin-bottom:16px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px;background:#0b1220;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
td{padding:10px;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-pending{background:#f59e0b20;color:#f59e0b}
.badge-paid{background:#22c55e20;color:#22c55e}
.err{color:#ef4444;font-size:13px;margin-top:12px}
.actions{display:flex;gap:8px}
</style>
</head>
<body>

<div class="container">
  <!-- 登录 -->
  <div class="login" id="login">
    <h2>🔐 Snapin 管理后台</h2>
    <input class="input" id="secret" type="password" placeholder="输入管理密钥" onkeydown="if(event.key==='Enter')login()"/>
    <button class="btn" style="width:100%" onclick="login()">登录</button>
    <div class="err" id="loginErr" style="display:none"></div>
  </div>

  <!-- 仪表盘 -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>📊 Snapin 管理后台</h1>
      <button class="btn btn-sm" onclick="logout()">退出</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">待处理订单</div>
        <div class="value" id="pendingCount">-</div>
      </div>
      <div class="stat-card">
        <div class="label">可用授权码</div>
        <div class="value" id="availableCount">-</div>
      </div>
      <div class="stat-card">
        <div class="label">已分配授权码</div>
        <div class="value" id="assignedCount">-</div>
      </div>
      <div class="stat-card">
        <div class="label">总订单数</div>
        <div class="value" id="totalOrders">-</div>
      </div>
    </div>

    <div class="section">
      <h3>⚙️ 快速操作</h3>
      <div class="actions">
        <button class="btn" onclick="generateKeys()">批量生成授权码 (10个)</button>
        <button class="btn" onclick="refreshData()">🔄 刷新数据</button>
      </div>
    </div>

    <div class="section">
      <h3>📦 待处理订单</h3>
      <table>
        <thead><tr><th>订单号</th><th>邮箱</th><th>渠道</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="pendingOrders"></tbody>
      </table>
    </div>

    <div class="section">
      <h3>✅ 最近已支付订单</h3>
      <table>
        <thead><tr><th>订单号</th><th>邮箱</th><th>授权码</th><th>确认时间</th></tr></thead>
        <tbody id="paidOrders"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = '';
let adminSecret = '';

async function login() {
  const secret = document.getElementById('secret').value.trim();
  if (!secret) return;
  adminSecret = secret;

  // 测试权限
  try {
    const res = await fetch(API + '/api/admin/pool', {
      headers: { 'x-admin-secret': secret }
    });
    if (!res.ok) throw new Error('密钥错误');
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    refreshData();
  } catch (e) {
    const err = document.getElementById('loginErr');
    err.textContent = '管理密钥错误';
    err.style.display = 'block';
  }
}

function logout() {
  adminSecret = '';
  document.getElementById('login').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

async function refreshData() {
  // 库存统计
  const poolRes = await fetch(API + '/api/admin/pool', {
    headers: { 'x-admin-secret': adminSecret }
  });
  const pool = await poolRes.json();
  document.getElementById('availableCount').textContent = pool.available;
  document.getElementById('assignedCount').textContent = pool.assigned;

  // 订单列表
  const ordersRes = await fetch(API + '/api/admin/orders?status=all', {
    headers: { 'x-admin-secret': adminSecret }
  });
  const orders = await ordersRes.json();
  
  const pending = orders.orders.filter(o => o.status === 'pending');
  const paid = orders.orders.filter(o => o.status === 'paid');
  
  document.getElementById('pendingCount').textContent = pending.length;
  document.getElementById('totalOrders').textContent = orders.orders.length;

  // 渲染待处理订单
  document.getElementById('pendingOrders').innerHTML = pending.length === 0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">暂无待处理订单</td></tr>'
    : pending.map(o => `
        <tr>
          <td><code>${o.order_no}</code></td>
          <td>${o.email}</td>
          <td>${o.channel === 'alipay' ? '💰 支付宝' : '💬 微信'}</td>
          <td style="color:var(--muted)">${new Date(o.created_at).toLocaleString('zh-CN')}</td>
          <td><button class="btn btn-sm btn-success" onclick="confirmOrder('${o.order_no}')">确认收款</button></td>
        </tr>
      `).join('');

  // 渲染已支付订单（最近10条）
  document.getElementById('paidOrders').innerHTML = paid.slice(0, 10).map(o => `
    <tr>
      <td><code>${o.order_no}</code></td>
      <td>${o.email}</td>
      <td><code style="color:var(--cyan)">${o.license_key}</code></td>
      <td style="color:var(--muted)">${new Date(o.confirmed_at).toLocaleString('zh-CN')}</td>
    </tr>
  `).join('');
}

async function confirmOrder(orderNo) {
  if (!confirm(`确认订单 ${orderNo} 已收款？将自动分配授权码并发送邮件。`)) return;
  try {
    const res = await fetch(API + '/api/admin/confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-secret': adminSecret
      },
      body: JSON.stringify({ order_no: orderNo })
    });
    const data = await res.json();
    if (data.ok) {
      alert(`✓ 订单已确认，授权码 ${data.license_key} 已发送至 ${data.email}`);
      refreshData();
    } else {
      alert('失败: ' + data.error);
    }
  } catch (e) {
    alert('错误: ' + e.message);
  }
}

async function generateKeys() {
  if (!confirm('批量生成 10 个授权码？')) return;
  try {
    const res = await fetch(API + '/api/admin/generate-keys', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-secret': adminSecret
      },
      body: JSON.stringify({ count: 10 })
    });
    const data = await res.json();
    if (data.ok) {
      alert(`✓ 已生成 ${data.generated} 个授权码，当前库存 ${data.total_available} 个`);
      refreshData();
    } else {
      alert('失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('错误: ' + e.message);
  }
}
</script>
</body>
</html>
