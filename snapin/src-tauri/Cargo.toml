[package]
name = "snapin"
version = "0.1.2"
description = "Snapin 闪贴 - 跨平台截图与贴图工具"
authors = ["Snapin Team"]
edition = "2021"

[lib]
name = "snapin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
xcap = "0.4"
chrono = "0.4"
base64 = "0.22"
arboard = "3"
image = "0.25"
reqwest = { version = "0.12", features = ["json"] }
hostname = "0.4"
num_cpus = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
