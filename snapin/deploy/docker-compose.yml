version: "3.8"

services:
  # 授权 + 支付 API 服务
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: snapin-api
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - api-data:/app/data
    environment:
      - PORT=3300
      - ADMIN_SECRET=${ADMIN_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_MCH_ID=${WECHAT_MCH_ID}
      - WECHAT_API_KEY_V3=${WECHAT_API_KEY_V3}
      - WECHAT_SERIAL_NO=${WECHAT_SERIAL_NO}
      - WECHAT_PRIVATE_KEY=${WECHAT_PRIVATE_KEY}
      - PAYMENT_NOTIFY_URL=${PAYMENT_NOTIFY_URL}
      - PRICE_CNY=${PRICE_CNY:-7900}

  # Nginx 反向代理 + 静态官网
  nginx:
    image: nginx:alpine
    container_name: snapin-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../website:/usr/share/nginx/html
      - ./certs:/etc/nginx/certs
    depends_on:
      - api

volumes:
  api-data:
